name: Build FaizIt APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Named FaizIt APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FaizIt.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaizIt-arm64-APK
          path: app/build/outputs/apk/debug/FaizIt.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "FaizIt v1.0.0 Release"
          body: |
            ### ⚡ FaizIt v1.0.0 - 1-Tap Media Downloader for Android
            - Native Android Share Sheet (`ACTION_SEND`) overlay
            - On-Device `yt-dlp` & FFmpeg extraction engine
            - Supports Instagram Reels, YouTube Shorts, X (Twitter), TikTok, Facebook
            - Architecture: `arm64-v8a` (~34.8 MB)
            - Gallery & MediaStore auto-indexing
          files: |
            app/build/outputs/apk/debug/FaizIt.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
